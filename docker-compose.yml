services:
  db:
    image: postgres:16-alpine
    container_name: citas-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Captura los correos de desarrollo: se ven en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: citas-mailpit
    ports:
      - "${MAILPIT_UI_PORT}:8025"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citas-backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      MAIL_REMITENTE: ${MAIL_REMITENTE}
      SMS_API_URL: ${SMS_API_URL}
      SMS_API_KEY: ${SMS_API_KEY}
      CLINICA_ZONA_HORARIA: ${CLINICA_ZONA_HORARIA}
      CANCELACION_MIN_HORAS: ${CANCELACION_MIN_HORAS}
      RECORDATORIO_HORAS: ${RECORDATORIO_HORAS}
      RECORDATORIO_ESPERAS_MIN: ${RECORDATORIO_ESPERAS_MIN}
      RECORDATORIO_MAX_INTENTOS: ${RECORDATORIO_MAX_INTENTOS}
      RECORDATORIO_CRON: ${RECORDATORIO_CRON}
    ports:
      - "${BACKEND_PORT}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
